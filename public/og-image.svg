<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8102E" />
      <stop offset="100%" stop-color="#FFD100" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Top Banner Accent -->
  <rect width="1200" height="12" fill="url(#accentGrad)" />

  <!-- Logo Emblem -->
  <g transform="translate(100, 100)">
    <rect width="90" height="90" rx="22" fill="url(#accentGrad)" />
    <text x="45" y="62" font-size="52" font-weight="900" text-anchor="middle" fill="#ffffff" font-family="'Noto Sans Kannada', sans-serif">ಕ</text>
  </g>

  <!-- Brand Name -->
  <text x="215" y="145" font-size="44" font-weight="900" fill="#ffffff" font-family="'Noto Sans Kannada', sans-serif">ಕನ್ನಡಟೂಲ್ಸ್</text>
  <text x="480" y="145" font-size="34" font-weight="500" fill="#94a3b8" font-family="system-ui, sans-serif">| KannadaTools</text>

  <!-- Main Headline -->
  <text x="100" y="270" font-size="56" font-weight="900" fill="#FFD100" font-family="'Noto Sans Kannada', sans-serif">
    ಉಚಿತ ಕನ್ನಡ ಪರಿಕರಗಳು
  </text>
  <text x="100" y="340" font-size="42" font-weight="700" fill="#ffffff" font-family="system-ui, sans-serif">
    Speak • Scan • Type • Clean
  </text>

  <!-- Description -->
  <text x="100" y="415" font-size="24" font-weight="400" fill="#cbd5e1" font-family="'Noto Sans Kannada', system-ui, sans-serif">
    ಲಿಪ್ಯಂತರಣ • ಪಠ್ಯ ಶುದ್ಧೀಕರಣ • ಚಿತ್ರದಿಂದ ಪಠ್ಯ (OCR) • ಧ್ವನಿಯಿಂದ ಪಠ್ಯ (Speech-to-Text)
  </text>
  <text x="100" y="455" font-size="20" font-weight="400" fill="#94a3b8" font-family="system-ui, sans-serif">
    100% Free • Open Source • Privacy-First • Zero Server Cost
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 510)">
    <rect width="210" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="105" y="28" font-size="16" font-weight="600" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif">⚡ In-Browser WASM</text>

    <rect x="230" width="230" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="345" y="28" font-size="16" font-weight="600" text-anchor="middle" fill="#4ade80" font-family="system-ui, sans-serif">🎙️ Kannada Whisper AI</text>

    <rect x="480" width="180" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="570" y="28" font-size="16" font-weight="600" text-anchor="middle" fill="#facc15" font-family="system-ui, sans-serif">🔒 100% Private</text>
  </g>
</svg>
